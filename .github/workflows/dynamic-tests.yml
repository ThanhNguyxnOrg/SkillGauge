name: 🧪 SkillGauge Dynamic Runtime Tests

on:
  workflow_dispatch:
    inputs:
      gemini_api_key:
        description: 'Optional Gemini API Key for running dynamic tests'
        required: false
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dynamic-testing:
    # Runs on every bot-created contrib-* submission PR and on manual dispatch.
    # Forks cannot provide the App key or Gemini secret, so only same-repo PRs qualify.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'contrib-'))
    runs-on: ubuntu-latest
    # One run per contribution branch: a newer push cancels the stale run so an
    # older audit cannot overwrite newer Phase 2 scores on the PR body.
    concurrency:
      group: dynamic-tests-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Core & CLI
        run: |
          npm run build -w packages/core
          npm run build -w packages/cli

      - name: 🧪 Run Dynamic Prompt Tests
        env:
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          node packages/cli/dist/index.js dynamic-test "skills/**/*.md"

      - name: 🤖 Generate GitHub App Token
        id: app-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@2b5c5cad571ee93fd091e16e1734ebd819191e68
        with:
          profile: issues
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📈 Update PR Description with Phase 2 Scores
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          node scripts/update-pr-dynamic.mjs
