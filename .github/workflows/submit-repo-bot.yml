name: 🤖 SkillGauge PR Submission Bot

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'The URL of the repository to clone and scan'
        required: true
      gemini_api_key:
        description: 'Optional Gemini API Key for running Phase 2 dynamic/semantic audit'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  process-submission:
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📁 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Core & CLI
        run: |
          npm run build -w packages/core
          npm run build -w packages/cli

      - name: 🤖 Process Submission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
        run: |
          git config --global user.name "ThanhNguyxnAgent[bot]"
          git config --global user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          node scripts/submit-bot.mjs --repository "${{ github.event.inputs.repository }}"

