name: 🤖 SkillGauge PR Submission Bot

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'The URL of the repository to clone and scan'
        required: true
      gemini_api_key:
        description: 'Optional Gemini API Key for running Phase 2 dynamic/semantic audit'
        required: false
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-submission:
    # Issue intake: the public web dashboard files a `[Submission]` issue;
    # applying the `submission-request` label is the maintainer approval gate
    # that starts the bot. This replaces the leaked-PAT workflow_dispatch flow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.label.name == 'submission-request' &&
       startsWith(github.event.issue.title, '[Submission]'))
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Generate GitHub App Token
        id: app-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@agent-v1
        with:
          profile: remediation
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 🔎 Resolve submitted repository
        id: submission
        env:
          INPUT_REPOSITORY: ${{ github.event.inputs.repository }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          repo="${INPUT_REPOSITORY:-}"
          if [ -z "$repo" ]; then
            repo="$(printf '%s' "${ISSUE_BODY:-}" | grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -1 || true)"
          fi
          if [ -z "$repo" ]; then
            repo="$(printf '%s' "${ISSUE_TITLE:-}" | grep -oE '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' | head -1 || true)"
            [ -n "$repo" ] && repo="https://github.com/$repo"
          fi
          repo="${repo%.git}"
          repo="${repo%/}"
          if ! printf '%s' "$repo" | grep -qE '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Could not resolve a github.com/owner/repo URL from the submission."
            exit 1
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "Resolved repository: $repo"

      - name: 💬 Acknowledge the submission issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUBMITTED_REPOSITORY: ${{ steps.submission.outputs.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "🤖 Submission accepted — auditing \`$SUBMITTED_REPOSITORY\` and opening a Pull Request with the results."

      - name: 📁 Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Core & CLI
        run: |
          npm run build -w packages/core
          npm run build -w packages/cli

      - name: Set ThanhNguyxnAgent Git identity
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-git-identity@agent-v1

      - name: 🤖 Process Submission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ github.event.inputs.gemini_api_key || secrets.GEMINI_API_KEY }}
          SUBMITTED_REPOSITORY: ${{ steps.submission.outputs.repository }}
        run: |
          node scripts/submit-bot.mjs --repository "$SUBMITTED_REPOSITORY"
