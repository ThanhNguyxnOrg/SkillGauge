name: Pilot Dynamic Eval (12 legs, manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leg:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: py-add
            skill: skills/ecc/python-coding-style.md
          - task: py-immutable
            skill: skills/ecc/python-coding-style.md
          - task: review-null
            skill: skills/ecc/code-reviewer.md
          - task: review-unused
            skill: skills/ecc/code-reviewer.md
          - task: flutter-setstate
            skill: skills/ecc/flutter-reviewer.md
          - task: flutter-key
            skill: skills/ecc/flutter-reviewer.md
        arm: [with, without]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python deps
        run: pip install pytest

      - name: Mount skill (with-arm only)
        if: matrix.arm == 'with'
        run: |
          mkdir -p "pilot/tasks/${{ matrix.task }}/environment/skill"
          cp "${{ matrix.skill }}" "pilot/tasks/${{ matrix.task }}/environment/skill/SKILL.md"

      - name: Agent run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/pilot-run.mjs --task "${{ matrix.task }}" --arm "${{ matrix.arm }}" \
            --skill "${{ matrix.skill }}" --out /tmp/leg

      - name: Verdict
        run: |
          export PILOT_WORK_DIR=/tmp/leg PILOT_LOG_DIR=/tmp/leg/logs
          bash "pilot/tasks/${{ matrix.task }}/verifier/test.sh"
          echo "reward=$(cat /tmp/leg/logs/reward.txt)"

      - name: Upload leg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leg-${{ matrix.task }}-${{ matrix.arm }}
          path: /tmp/leg

  collect:
    runs-on: ubuntu-latest
    needs: leg
    steps:
      - name: Download all legs
        uses: actions/download-artifact@v4
        with:
          path: legs
          merge-multiple: false

      - name: Build results.json + delta table
        run: |
          python3 - <<'EOF'
          import json, pathlib
          rows = []
          for reward_file in sorted(pathlib.Path('legs').rglob('logs/reward.txt')):
            leg = reward_file.parts[1]  # leg-<task>-<arm>
            _, task, arm = leg.split('-', 2)
            rows.append({'task': task, 'arm': arm, 'reward': int(reward_file.read_text().strip())})
          by_task = {}
          for r in rows:
            by_task.setdefault(r['task'], {})[r['arm']] = r['reward']
          print('| task | with | without | delta |')
          print('|---|---|---|---|')
          for task in sorted(by_task):
            w = by_task[task].get('with', 0)
            o = by_task[task].get('without', 0)
            print(f'| {task} | {w} | {o} | {w - o:+d} |')
          pathlib.Path('results.json').write_text(json.dumps(rows, indent=2))
          EOF

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-results
          path: results.json
