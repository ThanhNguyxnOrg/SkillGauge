name: 🔍 Manual PR Skills Verification

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'skills/**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Core & CLI
        run: |
          npm run build -w packages/core
          npm run build -w packages/cli

      - name: 🛡️ Run Anti-Spam Check
        id: anti_spam
        continue-on-error: true
        run: |
          node packages/cli/dist/index.js check-duplicate --target "skills/**/*.md" --db "leaderboard.json"
          echo "exit_code=$?" >> $GITHUB_ENV

      - name: 🤖 Generate GitHub App Token
        if: env.exit_code == '2'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 🚨 Handle Duplicate PR
        if: env.exit_code == '2'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🚨 **SkillGauge Audit Warning:** This skill matches an existing entry on the leaderboard. To prevent spam and plagiarized content, duplicate submissions are automatically rejected."
          exit 1

      - name: 🔬 Run SkillGauge Audit
        run: |
          node packages/cli/dist/index.js audit "skills/**/*.md" --fail-under 0 --summary summary.md

      - name: 📤 Publish Step Summary
        run: cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: 🤖 Generate Merge Token
        if: env.exit_code == '0' && startsWith(github.head_ref, 'contrib-') && github.event.pull_request.head.repo.full_name == github.repository
        id: merge-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: ✅ Auto-Merge Gated Skill PRs
        # All four gates must hold, else the PR waits for a human:
        # 1. duplicate check clean (exit 0) 2. audit ran without crashing
        # 3. source repo license allowlisted AND has a license file
        # 4. fewer than 50 skill files, all under the claimed source dir
        if: env.exit_code == '0' && startsWith(github.head_ref, 'contrib-') && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          SRC=$(printf '%s' "$BODY" | grep -oP '\*\*Source Repository:\*\* \[\K[^]]+' | head -1 || true)
          if [ -z "$SRC" ]; then echo "No source repo in body; leaving for human."; exit 0; fi
          # Bind the body claim to actual content: every skill file must live
          # under skills/<owner-repo-slug>/, else the claim is spoofed.
          SLUG=$(printf '%s' "$SRC" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]\+/-/g; s/^-\+//; s/-\+$//')
          LIC=$(gh api "repos/$SRC" --jq .license.spdx_id)
          FOUND_LICENSE=""
          for CAND in LICENSE LICENSE.md LICENSE.txt LICENCE COPYING; do
            if gh api "repos/$SRC/contents/$CAND" --jq .sha > /dev/null 2>&1; then FOUND_LICENSE="$CAND"; break; fi
          done
          if [ -z "$FOUND_LICENSE" ]; then echo "No license file; leaving for human."; exit 0; fi
          case "$LIC" in
            Apache-2.0|MIT|BSD-2-Clause|BSD-3-Clause) ;;
            *) echo "License $LIC not allowlisted; leaving for human."; exit 0 ;;
          esac
          FILES_JSON=$(gh pr view "$PR_NUMBER" --json files --jq '.files')
          COUNT=$(printf '%s' "$FILES_JSON" | jq '[.[] | select(.path | startswith("skills/"))] | length')
          TOTAL=$(printf '%s' "$FILES_JSON" | jq 'length')
          MATCHED=$(printf '%s' "$FILES_JSON" | jq --arg d "skills/$SLUG/" '[.[] | select(.path | startswith($d))] | length')
          : "${COUNT:?}" "${TOTAL:?}" "${MATCHED:?}"
          if [ "$COUNT" -ge 50 ] || [ "$COUNT" != "$TOTAL" ] || [ "$MATCHED" != "$COUNT" ]; then echo "Too big, touches non-skills files, or dir does not match claimed source; leaving for human."; exit 0; fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Auto-merged PR #$PR_NUMBER ($SRC, $COUNT skills, $LIC)."


