name: 🔄 SkillGauge Re-Audit All Skills

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  re-audit:
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📁 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Core & CLI
        run: |
          npm run build -w packages/core
          npm run build -w packages/cli

      - name: 🔄 Sync Local Data
        run: |
          node scripts/sync-skills.js

      - name: 📈 Re-Audit and Update Leaderboard JSON
        run: |
          node packages/cli/dist/index.js update-leaderboard --author "ThanhNguyxnAgent[bot]" --db "leaderboard.json" --readme "README.md" --target "skills/**/*.md"

      - name: 💾 Commit and Push Leaderboard Updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "ThanhNguyxnAgent[bot]"
          git config user.email "296222857+thanhnguyxnagent[bot]@users.noreply.github.com"
          git add leaderboard.json packages/web/src/data/
          git diff-index --quiet HEAD || (git commit -m "chore: re-audit all skills and update leaderboard database [skip ci]" && git push)

