name: 📈 Update Leaderboard on Main

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/*.md'

permissions:
  contents: write

# Serialize runs: concurrent merges race on push (non-fast-forward).
# Queue instead of cancel — every merge's skills must be audited.
concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint repository-scoped ThanhNguyxnAgent token
        id: app-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: 📁 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Core & CLI
        run: |
          npm run build -w packages/core
          npm run build -w packages/cli

      - name: 🚀 Run Auto-Optimizer
        run: |
          node packages/cli/dist/index.js optimize "skills/**/*.md"

      - name: 🔄 Sync Local Data
        run: |
          node scripts/sync-skills.js

      - name: 📈 Update Leaderboard JSON & README
        run: |
          # Extract author of the latest commit to record in the database
          AUTHOR=$(git log -1 --pretty=format:'%an')
          node packages/cli/dist/index.js update-leaderboard --author "$AUTHOR" --db "leaderboard.json" --readme "README.md" --target "skills/**/*.md"

      - name: Set ThanhNguyxnAgent commit identity
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-git-identity@da9d02544f60aeec92f8c851846ee3a587044beb

      - name: 💾 Commit and Push Leaderboard Updates
        run: |
          git add .
          git diff-index --quiet HEAD || (git commit -m "chore: update leaderboard and optimize skills [skip ci]" && git push)

